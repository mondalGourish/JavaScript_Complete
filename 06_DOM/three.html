<!-- how to create an element -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourish's Element</title>
</head>
<body style="background-color: black; color: white">
    
</body>
<script>
    const div = document.createElement("div")
    console.log(div)
    div.className = "ele"
    div.id = Math.floor(Math.random()*10+1)
    //mostly we use setAttribute instead of all this as it directly sets the attribute rather than taking class and id and then overwriting values to it. Basically it saves a roundtrip 
    div.setAttribute("title", "myTitle")

    // div.innerText = "Hello Buddy"
    //or
    const addText = document.createTextNode("(Hello buddy)")
    div.appendChild(addText)

    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    div.style.textAlign = "center"


    //now add this to the body
    document.body.appendChild(div)

</script>
</html>
