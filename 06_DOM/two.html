//All DOM selector
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM DOM</title>
  </head>
  <body style="background-color: black; color: white">
    <div class="parent">
      <div class="day">Mon</div>
      <div class="day">Tue</div>
      <div class="day">Wed</div>
      <div class="day">Thu</div>
    </div>
  </body>
  <script>
    const parent = document.querySelector(".parent");
    console.log(parent);
    //to access children of the parent
    const list = console.log(parent.children);
    for (let i = 0; i < parent.children.length; i++) {
      console.log(parent.children[i].innerText);
      parent.children[i].style.color = "orange";
      parent.children[i].style.backgroundColor = "blue";
    }
    //to print the first element
    console.log(parent.firstElementChild);
    //we can do the same using query selector
    let dayOne = document.querySelector(".day");
    console.log(dayOne);
    dayOne.innerText = "Monday";
    console.log(dayOne);
    console.log(dayOne.parentElement)
    console.log(dayOne.nextElementSibling) //gives the first sibling 
    
    console.log("NODES: ", parent.childNodes)

  </script>
</html>
