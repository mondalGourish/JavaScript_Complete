          />
        </li>
        <li>

        </li>
        <li>

        <li>
          <a style="color: aliceblue" href="https://google.com" id="google"
            >Google</a
          >
        </li>
      </ul>
    </div>

  <script>
    //The events in Js run sequentially but there are few exceptions
    //we can use events like onclick to perform certain functions but gives us less options

    // document.getElementById('owl').onclick = function(){
    //     alert("owl clicked");
    // }

    //its better to use eventListener than to use function like onClick and many like that
    document.getElementById("owl").addEventListener(
      "click",
      function (e) {
        // console.log(e)
      },
      false,
    );

    //things to read in events
    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    //event propagation -> mainly two cases event bubbling and event capturing
    //event bubbling
    /*document.getElementById().addEventListener('click',function(e){
        console.log(e)
    },false)*/
    //event capturing
    /*document.getElementById().addEventListener('click',function(e){
        console.log(e)
    },true)*/

    //event bubbling example
    document.getElementById("images").addEventListener(
      "click",
      function (e) {
        // console.log("ul clicked");
      },
      false,
    );
    document.getElementById("owl").addEventListener(
      "click",
      function (e) {
        // e.stopPropagation(); //it stops the bubbling and it doesnt go the above event
        // console.log("owl clicked");
      },
      false,
    );
    //if we click on images it prints ul clicked but in case of owl it prints owl clicked then ul clicked

    //event capturing example
    // document.getElementById("images").addEventListener('click',function(e){
    //     console.log("ul clicked")
    // },true)
    // document.getElementById("owl").addEventListener('click',function(e){
    //     console.log("owl clicked")
    // },true)
    //if we click on images it prints ul clicked but in case of owl it prints ul clicked then owl clicked

    document.getElementById("google").addEventListener(
      "click",
      function (e) {
        // console.log("google clicked");
        e.preventDefault();
        e.stopPropagation();
      },
      false,
    );

    document.querySelector("#images").addEventListener("click",function(e){
        console.log(e.target.tagName)
        if(e.target.tagName === "IMG"){
            console.log(e.target.id)
            let removeImg = e.target.parentNode
            console.log(removeImg)
            removeImg.remove()
        }
    },false)
  </script>
</html>
